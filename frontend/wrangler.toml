name = "true-portfolio"
compatibility_date = "2026-10-01"
routes = [
  { pattern = "trueportfolio.net", custom_domain = true },
  { pattern = "www.trueportfolio.net", custom_domain = true },
]
workers_dev = false
preview_urls = false

# Static site only: the API runs on Render (api.trueportfolio.net), so there is no Worker script.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"

[observability]
enabled = true
